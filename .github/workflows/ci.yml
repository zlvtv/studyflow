name: StudyFlow checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studyflow_test
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -h 127.0.0.1 -U studyflow -d studyflow_test'
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://studyflow:test-only@127.0.0.1:5432/studyflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s infra/tests -v
      - working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          pytest -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: backend/reports/pytest.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: frontend/reports/vitest.xml
  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check deployment lifecycle
        env:
          STUDYFLOW_DEPLOY_DIR: ${{ runner.temp }}/studyflow-runtime
          APP_TAG: ${{ github.sha }}
        run: bash infra/integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: reports/compose.log
