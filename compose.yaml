name: studyflow-course
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyflow}
      POSTGRES_USER: ${POSTGRES_USER:-studyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    image: ${IMAGE_PREFIX:-studyflow-course}/backend:${APP_TAG:-dev}
    pull_policy: never
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-studyflow}
      POSTGRES_USER: ${POSTGRES_USER:-studyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_VERSION: ${APP_TAG:-dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
  frontend:
    image: ${IMAGE_PREFIX:-studyflow-course}/frontend:${APP_TAG:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
